basePath: /
definitions:
  domain.Account:
    properties:
      account_no:
        type: string
      balance:
        type: number
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  domain.BulkTransferItemResult:
    properties:
      amount:
        type: number
      error:
        type: string
      status:
        type: string
      to_account_no:
        type: string
      tx_code:
        type: string
    type: object
  domain.BulkTransferRequest:
    properties:
      transfers:
        items:
          $ref: '#/definitions/domain.TransferRequest'
        type: array
    type: object
  domain.BulkTransferResponse:
    properties:
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/domain.BulkTransferItemResult'
        type: array
      success:
        type: integer
      total:
        type: integer
    type: object
  domain.DepositRequest:
    properties:
      amount:
        type: number
    type: object
  domain.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  domain.RegisterRequest:
    properties:
      full_name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  domain.Transaction:
    properties:
      amount:
        type: number
      created_at:
        type: string
      from_acc_id:
        type: integer
      id:
        type: integer
      note:
        type: string
      status:
        type: string
      to_acc_id:
        type: integer
      tx_code:
        type: string
    type: object
  domain.TransferRequest:
    properties:
      amount:
        type: number
      to_account_no:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Digital Wallet Service — chuyển tiền, quản lý tài khoản
  title: GoWallet API
  version: "1.0"
paths:
  /accounts/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Account'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy thông tin tài khoản đang đăng nhập
      tags:
      - accounts
  /deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Số tiền nạp
        in: body
        name: deposit
        required: true
        schema:
          $ref: '#/definitions/domain.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Nạp tiền vào tài khoản của chính mình (DEMO — mô phỏng nộp tiền mặt
        tại quầy, không kết nối cổng thanh toán thật)
      tags:
      - accounts
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username và password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng nhập lấy JWT token
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username, password, họ tên
        in: body
        name: info
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng ký tài khoản mới (tự tạo Account + User)
      tags:
      - auth
  /transactions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Transaction'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy lịch sử giao dịch của tài khoản đang đăng nhập
      tags:
      - transactions
  /transactions/{code}:
    get:
      parameters:
      - description: Mã giao dịch
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaction'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tìm 1 giao dịch theo mã giao dịch (chỉ xem được giao dịch của chính
        mình)
      tags:
      - transactions
  /transfer:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin chuyển tiền
        in: body
        name: transfer
        required: true
        schema:
          $ref: '#/definitions/domain.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chuyển tiền giữa 2 tài khoản
      tags:
      - transactions
  /transfer/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Danh sách lệnh chuyển tiền
        in: body
        name: transfers
        required: true
        schema:
          $ref: '#/definitions/domain.BulkTransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.BulkTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chuyển tiền hàng loạt (nhiều lệnh cùng lúc), xử lý song song có giới
        hạn qua Worker Pool
      tags:
      - transactions
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
